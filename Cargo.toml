[package]
name = "hatch"
version = "0.1.0"
edition = "2024"
description = "An MCP server that runs a sandboxed agent's shell commands and file writes on the host, but only after a human has read them in an approval window and said yes."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/skryvel/hatch"
keywords = ["mcp", "agent", "sandbox", "approval", "security"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
test-stub-prompter = []
# Marks strings and comments inside a Python or Clojure program handed to an
# interpreter. Off by default: an experiment, to see on real windows whether a
# TextMate grammar's reading is worth drawing. See `src/render/grammar.rs`.
highlight = ["dep:syntaxmate"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
# The one grammar hatch has. Pure Rust on purpose: it parses bytes an agent
# chose, and the alternative with a comparable grammar is a C one.
brush-parser = "0.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.36.1"
futures-core = "0.3.34"
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
# Writing one PNG, for `hatch preview --shot`. Already in the tree under
# eframe; the alternative was `image`, which is that plus a dozen codecs
# nothing here decodes.
png = "0.18.1"
rand = "0.10.2"
regex = "1.13.1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
# Only with `highlight`. Pure Rust, no unsafe, its own bounded regex engine
# rather than oniguruma -- the reason every other TextMate crate was out.
# Pinned exactly: it reads bytes an agent chose, and a new release of a 0.1
# crate by one author is not something to take unread. `bundled-grammars` is
# the whole catalogue (about 2 MB); hatch asks it for two of them.
syntaxmate = { version = "=0.1.3", optional = true, default-features = false, features = ["bundled-grammars"] }
strip-ansi-escapes = "0.2.1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.5"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.0", features = ["v4"] }

# macOS only, and only to name one constant. `open_window` states the
# application's activation policy rather than letting winit infer it from
# whether this process is bundled. Adds nothing to the build anywhere else,
# and nothing to the macOS build either: eframe already depends on this exact
# winit, and cargo resolves both to one copy of it.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"

[dev-dependencies]
proptest = "1.11.0"
reqwest = "0.13.4"

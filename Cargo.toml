[package]
name = "hatch"
version = "0.1.0"
edition = "2024"
description = "An MCP server that runs a sandboxed agent's shell commands and file writes on the host, but only after a human has read them in an approval window and said yes."
license = "MIT OR Apache-2.0"
readme = "README.md"
# No remote is configured for this checkout. Replace with the canonical URL
# before publishing; a wrong one here is worse than none.
# repository = "https://example.invalid/REPLACE-ME/hatch"
keywords = ["mcp", "agent", "sandbox", "approval", "security"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
test-stub-prompter = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.36.1"
futures-core = "0.3.34"
nix = { version = "0.31.3", features = ["signal", "process", "user"] }
rand = "0.10.2"
regex = "1.13.1"
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
strip-ansi-escapes = "0.2.1"
syntect = "5.3.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.5"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
reqwest = "0.13.4"
